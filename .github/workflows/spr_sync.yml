name: PRN Melaka - semak SPR dan terbitkan dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 12-17 14 11 *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: spr-election-sync
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SPR collector
        run: python -m unittest discover -s tests -v
      - name: Fetch SPR website JSON
        id: collector
        continue-on-error: true
        run: python scripts/sync_spr.py
      - name: Note upstream failure
        if: steps.collector.outcome == 'failure'
        run: echo '::warning::SPR source unavailable; retaining verified cache'
      - name: Commit cache if changed
        run: |
          if ! git diff --quiet -- data/results.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/results.json
            git commit -m 'chore: update SPR Melaka results'
            git push
          else
            echo 'No updated data'
          fi
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/results.json _site/data/results.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
