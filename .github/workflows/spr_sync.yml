name: PRN Melaka - semak SPR dan terbitkan dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/spr_sync.yml'
  schedule:
    # Voting-day VTO: 08:00-18:59 MYT; results: 20:00-01:59 MYT
    - cron: '*/5 0-10 14 11 *'
    - cron: '*/5 12-17 14 11 *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: spr-election-sync
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SPR collector
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type="application/json")[^>]*>(.*?)</script>',h,flags=re.S)
          Path('/tmp/melaka_frontend.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/melaka_frontend.js
      - name: Fetch SPR website JSON
        id: collector
        continue-on-error: true
        env:
          FORCE_SPR_SYNC: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/sync_spr.py
      - name: Refresh Bernama unofficial seats
        id: bernama
        continue-on-error: true
        run: python scripts/sync_bernama.py
      - name: Read public SPR turnout summary (best effort)
        id: vto
        continue-on-error: true
        run: python scripts/sync_vto.py
      - name: Note upstream failure
        if: steps.collector.outcome == 'failure'
        run: echo '::warning::SPR source unavailable; retaining verified cache'
      - name: Commit cache if changed
        run: |
          if ! git diff --quiet -- data/results.json data/vto.json data/bernama.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/results.json data/vto.json data/bernama.json
            git commit -m 'chore: update SPR Melaka results'
            git push
          else
            echo 'No updated data'
          fi
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/results.json _site/data/results.json
          cp data/vto.json _site/data/vto.json
          cp data/bernama.json _site/data/bernama.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
