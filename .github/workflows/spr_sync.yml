name: PRN Melaka - MyUndi Nightboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/spr_sync.yml'
      - 'data/myundi.json'
  schedule:
    # Count night, 14 Nov 2026 20:00–15 Nov 01:59 MYT
    - cron: '*/5 12-17 14 11 *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: spr-election-sync
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test MyUndi parser and existing unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type="application/json")[^>]*>(.*?)</script>',h,flags=re.S)
          Path('/tmp/melaka_frontend.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/melaka_frontend.js
      - name: Refresh public MyUndi vote counts (best effort)
        id: collector
        continue-on-error: true
        run: python scripts/sync_myundi.py
      - name: Refresh official SPR party totals from AWANI (best effort)
        run: python scripts/sync_awani.py
      - name: Commit cache if changed
        run: |
          if ! git diff --quiet -- data/myundi.json data/awani.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/myundi.json data/awani.json
            git commit -m 'chore: refresh Melaka results from validated sources'
            # Concurrent human edits can move main; retry without force pushing.
            for attempt in 1 2 3; do
              if git push; then
                echo 'Published data commit'
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Concurrent data edits need review; continuing safe Pages deploy'
                break
              fi
            done
          else
            echo 'No updated data'
          fi
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/myundi.json _site/data/myundi.json
          cp data/awani.json _site/data/awani.json
          cp data/vto.json _site/data/vto.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
